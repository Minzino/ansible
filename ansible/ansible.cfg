[defaults]
inventory = inventory/
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = /usr/bin/python3
callback_whitelist = profile_tasks
timeout = 30
stdout_callback = yaml
bin_ansible_callbacks = True

[ssh_connection]
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r 