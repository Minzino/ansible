---
# tasks file for common role
- name: Update apt cache (Debian/Ubuntu)
  apt:
    update_cache: yes
    cache_valid_time: 3600 # Update cache if older than 1 hour
  become: true
  when: ansible_os_family == "Debian"

- name: Ensure essential packages are installed (Debian/Ubuntu)
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common # For add-apt-repository
      - gnupg
      - lsb-release
      - containerd # Add containerd
      - python3-pip # Needed for some ansible modules potentially
    state: present
  become: true
  when: ansible_os_family == "Debian"

# Kubernetes Prerequisites
- name: Ensure kernel modules are loaded
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  become: true

- name: Ensure kernel modules are loaded on boot
  copy:
    content: |-
      overlay
      br_netfilter
    dest: /etc/modules-load.d/k8s.conf
    mode: '0644'
  become: true

- name: Set kernel parameters for Kubernetes
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/k8s.conf
    reload: yes
  loop:
    - { key: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { key: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
    - { key: 'net.ipv4.ip_forward', value: '1' }
  become: true

- name: Disable swap
  command: swapoff -a
  become: true
  when: ansible_swaptotal_mb > 0

- name: Remove swap entry from /etc/fstab
  mount:
    name: swap
    fstype: swap
    state: absent
  become: true

# Containerd Configuration
- name: Create containerd configuration directory
  file:
    path: /etc/containerd
    state: directory
    mode: '0755'
  become: true

- name: Generate default containerd configuration
  command: containerd config default
  register: containerd_config_default
  changed_when: false
  become: true

- name: Save default containerd configuration
  copy:
    content: "{{ containerd_config_default.stdout }}"
    dest: /etc/containerd/config.toml
    mode: '0644'
  become: true
  notify: restart containerd # Add handler later

- name: Ensure SystemdCgroup is enabled in containerd config
  lineinfile:
    path: /etc/containerd/config.toml
    regexp: '(\[plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options\])'
    line: '\1\n            SystemdCgroup = true'
    backrefs: yes
    insertafter: '^\[plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options\]' # Ensure it's placed correctly
    state: present
  become: true
  notify: restart containerd # Handler needed

