---
# Common setup tasks for all Kubernetes nodes

- name: Update package cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install basic dependencies
  ansible.builtin.package:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3
      - python3-pip
      - net-tools
    state: present
  when: ansible_os_family == "Debian"

- name: Set up system settings for Kubernetes
  ansible.builtin.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  with_items:
    - {key: net.bridge.bridge-nf-call-iptables, value: 1}
    - {key: net.bridge.bridge-nf-call-ip6tables, value: 1}
    - {key: net.ipv4.ip_forward, value: 1}

- name: Disable swap - running
  ansible.builtin.command: swapoff -a
  changed_when: false
  register: disable_swap
  when: ansible_swaptotal_mb > 0

- name: Disable swap - permanent
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    line: '# \1'
    backrefs: yes
  when: ansible_swaptotal_mb > 0

- name: Ensure br_netfilter module is loaded
  ansible.builtin.modprobe:
    name: br_netfilter
    state: present

- name: Ensure overlay module is loaded
  ansible.builtin.modprobe:
    name: overlay
    state: present

- name: Add modules to /etc/modules
  ansible.builtin.lineinfile:
    path: /etc/modules
    line: "{{ item }}"
    create: yes
  with_items:
    - br_netfilter
    - overlay

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  when: inventory_hostname is defined

# Containerd Configuration
- name: Create containerd configuration directory
  file:
    path: /etc/containerd
    state: directory
    mode: '0755'
  become: true

- name: Generate default containerd configuration
  command: containerd config default
  register: containerd_config_default
  changed_when: false
  become: true

- name: Save default containerd configuration
  copy:
    content: "{{ containerd_config_default.stdout }}"
    dest: /etc/containerd/config.toml
    mode: '0644'
  become: true
  notify: restart containerd # Add handler later

- name: Ensure SystemdCgroup is enabled in containerd config
  lineinfile:
    path: /etc/containerd/config.toml
    regexp: '(\[plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options\])'
    line: '\1\n            SystemdCgroup = true'
    backrefs: yes
    insertafter: '^\[plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options\]' # Ensure it's placed correctly
    state: present
  become: true
  notify: restart containerd # Handler needed

